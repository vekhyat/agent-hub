name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  local-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest -v verify regressions packaging_checks profile_checks terminal_checks
      - run: agent-hub --help
