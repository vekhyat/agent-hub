# Merge the entries you need into your own agent-hub/profiles.toml.
# Each home is a native CLI configuration directory, not a project directory.

[profiles.claude-work]
kind = "claude"
home = "~/.claude-work"

[profiles.claude-personal]
kind = "claude"
home = "~/.claude-personal"

[profiles.codex-work]
kind = "codex"
home = "~/.codex-work"

[profiles.codex-personal]
kind = "codex"
home = "~/.codex-personal"

# An existing launcher executable can be kept as a profile.
# Its home must match the directory the launcher selects.
# [profiles.codex1]
# kind = "codex"
# command = "codex1"
# home = "~/.codex"
